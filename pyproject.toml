[project]
name = "tcemg-contas"
version = "0.1.0"
description = "Repositório de documentação e apoio às respostas da SPLOR/SEPLAG ao TCEMG"
authors = [
    {name = "vivigoncalvesportonascimento"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymupdf (>=2.1,<3.0)",
    "pdfplumber (>=0.11.10,<0.12.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
